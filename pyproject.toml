[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renmark"
version = "0.38.0"
description = "Multi-LLM orchestration: brainstorm, plan, orchestrate, debug, codereview. Persistent project memory."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "renmark" }]
license = { text = "MIT" }
keywords = ["orchestration", "multi-llm", "codex", "haiku", "sonnet", "opus", "claude-code"]
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]
browser = [
    "playwright>=1.40.0",
]

# Note: no [project.scripts] entry — the canonical CLI is the bash wrapper at
# bin/renmark-execute, which install.sh symlinks to ~/.local/bin/. On Windows or
# where the wrapper is unavailable, invoke via `python -m renmark` instead.

[tool.setuptools.packages.find]
include = ["renmark*"]
exclude = ["tests*", "plugin*", "bin*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E402",   # module-level imports after section comments — intentional refactoring pattern
    "RUF001", # ambiguous unicode in identifiers — renmark uses intentional stylization
    "RUF003", # ambiguous unicode in comments — same reason (×, ℹ, ⚠, etc. in stylized output)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841", "B011"]
"renmark/init.py" = ["E501"]   # contains long template strings for project-map.md rendering

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["build/", "dist/", "\\.venv/", "tests/"]
