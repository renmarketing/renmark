# R-0.1 release contract. Shape per release-contract-template.yaml
# (governing-methodology-addendum-02.md). Scope per governing-methodology-
# addendum-01.md's revised Phase 1 (UX/compatibility harness) + the blocking
# subset of Phase 2 (authority boundaries and budget controls).
#
# STATUS: READY. Owner-approved as drafted 2026-08-01. WP-1 is authorized
# to start. WP-2 through WP-5 remain individually gated — see
# work_packages[].status below. allowed_paths stays empty until an explicit
# amendment names exact modules, same discipline as R-0.0.

release_id: R-0.1
title: Bounded Small-Task Fast Path
release_type: feature   # first genuinely user-testable release in this sequence

phases_drawn_from:
  - phase: 1
    contribution: "UX and compatibility harness (entire phase)"
  - phase: 2
    contribution: "blocking subset only — authority boundaries + budget controls needed to make the fast path safe. Non-blocking Phase 2 items (full role separation, Planner altitude modes) stay out of scope."

gates:
  gated_by: R-0.0   # R-0.0 is RELEASED — this gate is satisfied; contract may proceed to READY on Owner approval
  gates_release: R-0.2   # working title only, not yet drafted — full authority-boundary enforcement beyond the fast path's bounded scope

user_value:
  actor: "The Owner, using Renmark's existing single-command interface (e.g. /renmark:feature, /renmark:debug)"
  capability: >
    Small, bounded tasks (per addendum-01's routing model: "Small local task →
    General Contractor → Worker → deterministic tests → Inspector only if risk
    requires it") run through a fast path that skips milestone decomposition
    and multi-agent ceremony, while gaining the authority-boundary guarantees
    R-0.0's Scenario C finding showed are currently absent: a Worker cannot
    take an action outside its assigned scope without it being either
    forbidden by contract or explicitly surfaced for approval — not merely
    caught by luck or an external platform safety net.
  problem_addressed: >
    Today, per R-0.0/closeout.md finding 1 (Scenario C): a dispatched
    subagent attempted an unauthorized destructive action (force-deleting
    pre-existing files it did not create) with nothing in renmark/** itself
    to stop it — only the platform's own permission classifier did. Separately,
    per addendum-01 §4, small tasks currently pay for architecture/ceremony
    the routing model says they shouldn't need, and that ceremony was never
    justified against a measured baseline until R-0.0.

user_journey:
  starting_state: >
    Renmark v0.39.3. R-0.0's baseline (metrics/baseline-report.md) is the
    "before" picture. No fast path exists yet — all tasks, regardless of
    size, go through the same dispatch/verification flow. No Worker-scope
    enforcement exists beyond the platform's own permission prompts.
  action: >
    Owner (or existing skill entry points) issues a small, bounded change
    request. General Contractor classifies it as small per a defined
    threshold, dispatches a single Worker with an explicit, narrow file/
    action scope, runs deterministic tests, and only escalates to an
    Inspector if a defined risk trigger fires (e.g. touches renmark/**,
    deletes/renames files, or the Worker's diff exceeds the declared scope).
  expected_result: >
    Measured against R-0.0's baseline for tasks in the same class as
    Scenario A: fewer or equal model/agent invocations, no increase in
    context/duration, and — the primary new guarantee — a Worker attempting
    an out-of-scope destructive action (delete/rename/modify outside its
    declared file scope) is blocked by Renmark's own contract enforcement,
    not left to the platform's permission classifier alone.

scope:
  included:
    - "A defined 'small task' classification threshold (file count, action type, risk keywords) — General Contractor routes qualifying tasks to the fast path automatically, per addendum-01's routing model"
    - "Explicit per-dispatch Worker scope: an allowed-paths/allowed-actions declaration the Worker receives, distinct from (and narrower than) the broad tool permissions it's granted by the host"
    - "Deterministic enforcement that a Worker's actual file operations stay inside its declared scope — violations are blocked or require explicit escalation, not merely logged after the fact"
    - "A 'no nested dispatch' guarantee for fast-path tasks (a Worker cannot itself dispatch another agent)"
    - "A capped retry/replan count on the fast path, consistent with existing repeated-issue-prevention guidance"
    - "Regression tests proving the existing single-command UX (/renmark:start, /renmark:feature, /renmark:debug, etc.) is unchanged for tasks that do NOT qualify for the fast path"
    - "A benchmark comparison re-running R-0.0's Scenario A (or an equivalent small task) through the new fast path and citing the delta against R-0.0's baseline numbers directly, per R-0.0's own observation.metrics expectation"
  excluded:
    - "Full Planner altitude separation (Architecture mode / Milestone mode) — Phase 5, not in scope here"
    - "Inspector specialization beyond one combined Inspector — Phase 4, deferred"
    - "The minimal canonical ledger consolidation — Phase 3, deferred unless R-0.1 discovers it's a hard blocker"
    - "WritingMate or any remote-provider work — Phase 7, still blocked"
    - "Retroactive enforcement changes to Normal Feature or Architectural Feature paths — this release only touches the Small Task fast path"
  allowed_paths:
    # Amended 2026-08-01 for WP-3: a new regression-test file, not renmark/**
    # production code. prohibited_paths below never listed tests/ - this is
    # a documentation amendment, not a scope exception. renmark/** itself
    # stays prohibited until a future WP-4 amendment names exact modules.
    - "tests/test_r0_1_ux_regression_baseline.py"
    # Amended 2026-08-01 for WP-4 (core): one new, isolated module
    # implementing WP-1/WP-2's design docs exactly, plus its tests.
    - "renmark/fast_path.py"
    - "tests/test_fast_path.py"
    # Amended 2026-08-01 for WP-4 (live wiring, Owner-approved: "Wire it in
    # now"): build_fast_path_agent_dispatch() added to claude_agent.py as a
    # NEW function alongside the existing build_agent_dispatch, which is
    # unmodified (asserted by
    # test_build_agent_dispatch_unaffected_by_fast_path_addition) - preserves
    # WP-3's unchanged-behavior guarantee for non-fast-path dispatches.
    - "renmark/providers/claude_agent.py"
  prohibited_paths:
    - "renmark/** (until allowed_paths is explicitly amended post-approval, same discipline as R-0.0)"
    - "plugin/**"
    - ".renmark/state/**"
    - ".renmark/memory/**"

work_packages:
  - id: WP-1
    title: Small-task classification threshold and routing design
    produces: "milestones/R-0.1/classification-design.md"
    status: >
      COMPLETE (2026-08-01) — classification-design.md drafted: 5 deterministic
      signals (declared scope ≤2 named files, add/modify only, no renmark/**
      or plugin/** target, no cross-file dependency via existing
      dispatch.validate_wave check, single deterministic verifier), reusing
      existing primitives (validate_wave, Task.complexity as an accelerant
      not sole signal, the deterministic-first gate's shape applied one layer
      earlier at request-routing time). Explicitly excludes delete/rename
      actions from the fast path by definition (the exact action class from
      R-0.0's Scenario C finding), independent of WP-2's enforcement work.
      One open question flagged, not resolved: renmark/**/plugin/** targets
      are excluded from the fast path entirely for R-0.1's first cut
      (conservative default) - revisiting that is out of scope here.
  - id: WP-2
    title: Worker scope-enforcement design (the direct answer to R-0.0's Scenario C finding)
    produces: "milestones/R-0.1/scope-enforcement-design.md, decisions/ADR-002-worker-scope-enforcement.md"
    status: >
      COMPLETE (2026-08-01) — scope-enforcement-design.md + ADR-002 drafted.
      Two-layer model: Layer A (host permission prompt - pre-existing, out of
      scope to change, confirmed as what actually blocked Scenario C) + Layer
      B (new, Renmark-owned, deterministic verify_worker_scope() comparing
      declared WorkerScope against actual `git diff --name-status`, never
      against self-reported touched_files). Delete/rename is always a
      violation on the fast path; any out-of-allowed_paths touch is a
      violation. FAIL blocks merge/commit, does not auto-revert, escalates to
      Inspector/Owner, records to an append-only ledger. The literal Scenario
      C reproduction (scope excluding the 4 .renmark/audits/* files, a diff
      deleting them) is specified as a required WP-4 regression test. No-
      nested-dispatch enforcement honestly flagged as partially unresolved
      (no host-independent signal exists today) rather than overclaimed - left
      as an explicit WP-4 open question. Zero renmark/** changes - docs-only.
  - id: WP-3
    title: UX regression test suite for non-fast-path commands
    produces: "tests/test_r0_1_ux_regression_baseline.py"
    status: >
      COMPLETE (2026-08-01) — 4 tests pin TODAY's real dispatch/routing/gating
      behavior for task shapes that fail WP-1's fast-path classifier: a
      single renmark/** target (single-Agent/code-implementer routing), a
      2-file parallel wave (fanout via Workflow), a medium-complexity task
      (subagent_gate.justify_task verdict), and the existing 8-location
      version-drift invariant (unrelated to R-0.1, asserted to stay clean
      throughout). Each assertion was verified against live current output
      before being pinned, not guessed. WP-4 must not change any assertion
      here for these shapes — a fast path is additive, not a replacement of
      existing Normal/Architectural Feature routing. Full suite: 1662
      passed (1658 + 4 new), 31 skipped - zero regressions. allowed_paths
      amended to name this one new test file (not renmark/** production
      code - tests/ was never in prohibited_paths).
  - id: WP-4
    title: Implementation (classification + scope enforcement + no-nested-dispatch + retry cap)
    produces: "renmark/fast_path.py, renmark/providers/claude_agent.py (build_fast_path_agent_dispatch, additive), tests/test_fast_path.py"
    status: >
      COMPLETE (2026-08-01) — core: renmark/fast_path.py implements both
      design docs exactly: classify_fast_path() (WP-1's 5 signals, returns
      ALL failed signals not just the first, for a complete ledger
      justification) and WorkerScope/verify_worker_scope() (WP-2's Layer B —
      compares declared scope against REAL `git diff --name-status`, never
      self-reported touched_files; delete/rename always a violation
      regardless of path; fails CLOSED on an unverifiable repo, never a
      silent pass). Retry cap needs no new code: reuses the existing
      decide_milestone_execution third-equivalent-repair block
      (program_driver.py, already tested) per WP-1/WP-2's "reused, not new"
      discipline.
      Live wiring (Owner-approved 2026-08-01, "Wire it in now"):
      claude_agent.build_fast_path_agent_dispatch() composes a real,
      single-Worker prompt for a classified-eligible wave — explicit
      enumerated scope, explicit delete/rename prohibition, explicit
      no-nested-dispatch prohibition (WP-2 §6 option (a), contractual — no
      host-independent enforcement signal exists) — and carries the same
      WorkerScope on AgentDispatch.scope for the post-hoc
      verify_worker_scope() call. build_agent_dispatch (existing,
      non-fast-path) is UNMODIFIED - added as a new sibling function, not an
      edit, verified by a dedicated regression test asserting its prompt has
      no fast-path language and scope=None. No program_driver.py change was
      needed: the actual Agent-tool call is issued by the host session
      (General Contractor) itself, not by renmark's Python layer, so there
      is no Python-side "accept and merge" call site to rewire - the
      documented live call sequence (module docstring) is what General
      Contractor follows directly.
      20 tests total, including the literal required R-0.0 Scenario C
      reproduction (a scope excluding 4 pre-existing audit files, a diff
      deleting them, asserted to fail with all 4 listed). Full suite: 1682
      passed (1662 + 20 new), 31 skipped, zero regressions.
  - id: WP-5
    title: Benchmark comparison against R-0.0 baseline + evidence compilation
    produces: "metrics/r-0-1-comparison.md, metrics/r-0-1-comparison.json, citing R-0.0/metrics/baseline-scenario-a.json directly"
    depends_on: [WP-4]
    status: >
      COMPLETE (2026-08-01) — one live subagent dispatched via the real
      build_fast_path_agent_dispatch() prompt, in a disposable worktree off
      main HEAD (8589315), re-running R-0.0's exact Scenario A task text.
      Owner-approved budget (2 invocations / 40,000 tokens / 10 minutes, one
      pass) - observed: 1 invocation, 41,260 tokens (103.2% of target, flagged
      as a caveat, not a circuit-breaker trip), 21.0s wall-clock. Primary
      result: verify_worker_scope() ran for real against the subagent's
      actual git diff (not its self-report) and PASSED - the first live,
      non-synthetic exercise of Layer B. Independently re-verified: git
      status/diff confirmed only tests/test_hosts.py changed; pytest
      re-run separately, 14/14 passed. Comparison to R-0.0's Scenario A
      explicitly NOT presented as a controlled A/B (different starting
      commit, longer fast-path prompt, n=1 per condition) - flagged as a
      caveat in r-0-1-comparison.md rather than overclaimed. Worktree
      removed after measurement.

engineering_acceptance:
  - "A Worker dispatched with a declared scope cannot perform a file operation outside that scope without either being blocked or triggering an explicit escalation — demonstrated with a reproduction of a Scenario-C-shaped case (attempted deletion of a file outside declared scope)"
  - "Fast-path tasks show no nested dispatch (a Worker cannot invoke another agent) — enforced, not merely documented"
  - "Existing non-fast-path command entrypoints show zero behavior change (regression suite from WP-3 passes)"
  - "Fast-path resource usage on an R-0.0-equivalent small task is no worse than R-0.0's Scenario A baseline (or the delta is explained, not hidden)"
  - "Full existing test suite still passes after implementation"

required_inspections:
  - contract
  - runtime
  - security   # new for this release, given the direct link to the Scenario C finding — an independent check that the scope-enforcement mechanism actually blocks the reproduction case, not just passes its own unit tests

user_acceptance:
  scenario: "TBD at WP-1/WP-2 design time — must include a literal reproduction of R-0.0's Scenario C unauthorized-delete shape as a pass/fail case, per follow-up item F2 in R-0.0/closeout.md"
  evidence_required:
    - "Classification/routing design doc"
    - "Scope-enforcement design doc + the Scenario-C-shaped reproduction test, passing"
    - "UX regression suite, passing"
    - "Benchmark comparison against R-0.0's baseline"
  decision_authority: Owner
  delegated_acceptance:
    eligible: false   # first user-testable release with real security-relevant scope enforcement — not proposed for delegation by default; Owner may change this explicitly
    delegated: false
    delegate_to: null

release:
  channel: "existing repo channel — see R-0.0/release-candidate-and-tagging-policy.md, no new distribution system"
  artifact: []   # TBD — populated as work packages complete
  rollback: "Same as R-0.0: tag at pre-R-0.1 commit; if a scope-enforcement bug is found post-release, revert is a normal git revert since no distribution channel beyond this repo is introduced"

observation:
  period: "TBD at WP-5 — likely the interval until the next several small tasks have run through the fast path in real use"
  metrics:
    - "count of Worker scope-violation attempts blocked vs. escalated vs. missed (the last should be zero)"
    - "fast-path resource usage vs. R-0.0 Scenario A baseline, ongoing"
    - "Owner-reported ceremony/friction regressions, if any"

