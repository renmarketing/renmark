name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check renmark/
      - name: ruff format --check
        run: ruff format --check renmark/
      - name: mypy
        run: mypy renmark/
      - name: pytest
        run: pytest -q
      - name: drift check
        run: python -m renmark.release check
      - name: plugin lint
        run: python -m renmark.lint
